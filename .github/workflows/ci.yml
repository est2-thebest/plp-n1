name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore GuildRaidManager.sln
      - name: Build
        run: dotnet build GuildRaidManager.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test GuildRaidManager.sln --no-build --configuration Release
