<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Raid Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div>
          <p class="topbar__eyebrow">N1 · Paradigmas de Programação</p>
          <h1 class="topbar__title">Guild Raid Manager</h1>
          <p class="topbar__lead">Uma tela para C# e Erlang. A regra de negócio fica no backend.</p>
        </div>
        <label class="field field--inline">
          <span class="field__label">Backend</span>
          <select id="backend" class="field__control">
            <option value="mock">Mock · demo da tela</option>
            <option value="csharp">C# · localhost:5000</option>
            <option value="erlang">Erlang · localhost:8080</option>
          </select>
        </label>
      </div>
      <nav class="nav wrap" aria-label="Seções">
        <button class="nav__item nav__item--ativo" type="button" data-pagina="jogadores">Jogadores</button>
        <button class="nav__item" type="button" data-pagina="raids">Raids</button>
      </nav>
    </header>

    <p id="status" class="banner" hidden></p>

    <main class="wrap">
      <section id="pagina-jogadores" class="pagina">
        <article class="card">
          <div class="card__head">
            <h2 class="card__title">Jogadores</h2>
            <button class="btn btn--primary" type="button" data-abrir-modal="jogador">Cadastrar jogador</button>
          </div>
          <div class="toolbar">
            <label class="field field--grow">
              <span class="field__label">Buscar</span>
              <input class="field__control" id="filtro-jogador-busca" type="search" placeholder="Nome ou id" />
            </label>
            <label class="field">
              <span class="field__label">Função</span>
              <select class="field__control" id="filtro-jogador-funcao">
                <option value="">Todas</option>
                <option value="tank">tank</option>
                <option value="healer">healer</option>
                <option value="dps">dps</option>
              </select>
            </label>
            <label class="field field--grow">
              <span class="field__label">Raid</span>
              <select class="field__control" id="filtro-jogador-raid">
                <option value="">Todas as raids</option>
              </select>
            </label>
            <button class="btn btn--ghost toolbar__limpar" type="button" id="limpar-filtros-jogador" hidden>
              Limpar
            </button>
          </div>
          <div id="lista-jogadores" class="stack"></div>
        </article>
      </section>

      <section id="pagina-raids" class="pagina" hidden>
        <article class="card">
          <div class="card__head">
            <h2 class="card__title">Raids</h2>
            <button class="btn btn--primary" type="button" data-abrir-modal="raid">Criar raid</button>
          </div>
          <div class="toolbar">
            <label class="field field--grow">
              <span class="field__label">Buscar</span>
              <input class="field__control" id="filtro-raid-busca" type="search" placeholder="Nome ou id" />
            </label>
            <button class="btn btn--ghost toolbar__limpar" type="button" id="limpar-filtros-raid" hidden>
              Limpar
            </button>
          </div>
          <div id="lista-raids" class="stack"></div>
        </article>
      </section>
    </main>

    <dialog class="modal" id="modal-jogador" aria-labelledby="titulo-modal-jogador">
      <div class="modal__head">
        <h2 class="modal__title" id="titulo-modal-jogador">Cadastrar jogador</h2>
        <button class="btn btn--ghost" type="button" data-fechar-modal="jogador">Fechar</button>
      </div>
      <form id="form-jogador" class="form form--grade" novalidate>
        <label class="field">
          <span class="field__label">Id</span>
          <input class="field__control" name="id" required maxlength="4" inputmode="numeric" pattern="[0-9]{1,4}" placeholder="Ex: 12" />
        </label>
        <label class="field">
          <span class="field__label">Nome</span>
          <input class="field__control" name="nome" required />
        </label>
        <label class="field">
          <span class="field__label">Classe</span>
          <select class="field__control" name="classe">
            <option value="guerreiro">guerreiro</option>
            <option value="paladino">paladino</option>
            <option value="sacerdote">sacerdote</option>
            <option value="mago">mago</option>
            <option value="ladino">ladino</option>
            <option value="ranger">ranger</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">Função</span>
          <select class="field__control" name="funcao">
            <option value="tank">tank</option>
            <option value="healer">healer</option>
            <option value="dps">dps</option>
          </select>
        </label>
        <button class="btn btn--primary" type="submit">Cadastrar</button>
      </form>
    </dialog>

    <dialog class="modal" id="modal-raid" aria-labelledby="titulo-modal-raid">
      <div class="modal__head">
        <h2 class="modal__title" id="titulo-modal-raid">Criar raid</h2>
        <button class="btn btn--ghost" type="button" data-fechar-modal="raid">Fechar</button>
      </div>
      <form id="form-raid" class="form form--grade" novalidate>
        <label class="field">
          <span class="field__label">Id</span>
          <input class="field__control" name="id" required maxlength="4" inputmode="numeric" pattern="[0-9]{1,4}" placeholder="Ex: 12" />
        </label>
        <label class="field">
          <span class="field__label">Nome</span>
          <input class="field__control" name="nome" required />
        </label>
        <label class="field">
          <span class="field__label">Data</span>
          <input class="field__control" name="data" type="date" required />
        </label>
        <label class="field">
          <span class="field__label">Tanks</span>
          <input class="field__control" name="limiteTank" type="number" min="0" value="1" required />
        </label>
        <label class="field">
          <span class="field__label">Healers</span>
          <input class="field__control" name="limiteHealer" type="number" min="0" value="1" required />
        </label>
        <label class="field">
          <span class="field__label">DPS</span>
          <input class="field__control" name="limiteDps" type="number" min="0" value="1" required />
        </label>
        <button class="btn btn--primary" type="submit">Criar raid</button>
      </form>
    </dialog>

    <dialog class="modal" id="modal-historico" aria-labelledby="titulo-modal-historico">
      <div class="modal__head">
        <h2 class="modal__title" id="titulo-modal-historico">Histórico</h2>
        <button class="btn btn--ghost" type="button" data-fechar-modal="historico">Fechar</button>
      </div>
      <div id="historico" class="history"></div>
    </dialog>

    <dialog class="modal modal--wide" id="modal-detalhe-raid" aria-labelledby="raid-titulo">
      <div class="modal__head">
        <h2 class="modal__title">Raid: <span id="raid-titulo"></span></h2>
        <button class="btn btn--ghost" type="button" data-fechar-modal="detalhe-raid">Fechar</button>
      </div>
      <div id="raid-vagas" class="vagas"></div>

      <h3 class="card__subtitle">Inscrever</h3>
      <form id="form-inscricao" class="form" novalidate>
        <label class="field field--grow">
          <span class="field__label">Jogador</span>
          <select class="field__control" name="jogadorId" id="select-inscricao" required></select>
        </label>
        <button class="btn btn--primary" type="submit">Inscrever</button>
      </form>

      <div class="split split--dividir">
        <div>
          <h3 class="card__subtitle">Confirmados</h3>
          <div id="lista-confirmados" class="stack"></div>
        </div>
        <div>
          <h3 class="card__subtitle">Fila de espera</h3>
          <div id="lista-fila" class="stack"></div>
        </div>
      </div>

      <h3 class="card__subtitle">Presença</h3>
      <form id="form-presenca" class="form form--coluna" novalidate>
        <div id="check-presenca" class="stack"></div>
        <button class="btn btn--primary btn--bloco" type="submit">Registrar presença</button>
      </form>
      <p class="card__hint">Participantes efetivos: <span id="lista-participantes">—</span></p>

      <h3 class="card__subtitle">Loot</h3>
      <form id="form-loot" class="form form--grade" novalidate>
        <label class="field">
          <span class="field__label">Id</span>
          <input class="field__control" name="id" required />
        </label>
        <label class="field">
          <span class="field__label">Nome</span>
          <input class="field__control" name="nome" required />
        </label>
        <label class="field">
          <span class="field__label">Categoria</span>
          <select class="field__control" name="categoria">
            <option value="arma">arma</option>
            <option value="armadura">armadura</option>
            <option value="acessorio">acessorio</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">Função</span>
          <select class="field__control" name="funcaoRequerida">
            <option value="tank">tank</option>
            <option value="healer">healer</option>
            <option value="dps">dps</option>
          </select>
        </label>
        <button class="btn btn--primary" type="submit">Registrar item</button>
      </form>
      <div id="lista-loots" class="stack"></div>
    </dialog>

    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/modais.js"></script>
    <script src="js/navegacao.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
