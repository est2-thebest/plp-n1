<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Raid Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div>
          <p class="topbar__eyebrow">N1 · Paradigmas de Programação</p>
          <h1 class="topbar__title">Guild Raid Manager</h1>
          <p class="topbar__lead">Uma tela para C# e Erlang. A regra de negócio fica no backend.</p>
        </div>
        <label class="field field--inline">
          <span class="field__label">Backend</span>
          <select id="backend" class="field__control">
            <option value="csharp">C# · localhost:5000</option>
            <option value="erlang">Erlang · localhost:8080</option>
          </select>
        </label>
      </div>
    </header>

    <p id="status" class="banner" hidden></p>

    <main class="wrap">
      <section class="card">
        <h2 class="card__title">Jogadores</h2>
        <form id="form-jogador" class="form">
          <label class="field">
            <span class="field__label">Id</span>
            <input class="field__control" name="id" required />
          </label>
          <label class="field field--grow">
            <span class="field__label">Nome</span>
            <input class="field__control" name="nome" required />
          </label>
          <label class="field">
            <span class="field__label">Classe</span>
            <select class="field__control" name="classe">
              <option value="guerreiro">guerreiro</option>
              <option value="paladino">paladino</option>
              <option value="sacerdote">sacerdote</option>
              <option value="mago">mago</option>
              <option value="ladino">ladino</option>
              <option value="ranger">ranger</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Função</span>
            <select class="field__control" name="funcao">
              <option value="tank">tank</option>
              <option value="healer">healer</option>
              <option value="dps">dps</option>
            </select>
          </label>
          <button class="btn btn--primary" type="submit">Cadastrar</button>
        </form>
        <div id="lista-jogadores" class="stack"></div>
      </section>

      <section class="card">
        <h2 class="card__title">Raids</h2>
        <form id="form-raid" class="form">
          <label class="field">
            <span class="field__label">Id</span>
            <input class="field__control" name="id" required />
          </label>
          <label class="field field--grow">
            <span class="field__label">Nome</span>
            <input class="field__control" name="nome" required />
          </label>
          <label class="field">
            <span class="field__label">Data</span>
            <input class="field__control" name="data" type="datetime-local" required />
          </label>
          <label class="field">
            <span class="field__label">Tanks</span>
            <input class="field__control" name="limiteTank" type="number" min="0" value="1" required />
          </label>
          <label class="field">
            <span class="field__label">Healers</span>
            <input class="field__control" name="limiteHealer" type="number" min="0" value="1" required />
          </label>
          <label class="field">
            <span class="field__label">DPS</span>
            <input class="field__control" name="limiteDps" type="number" min="0" value="1" required />
          </label>
          <button class="btn btn--primary" type="submit">Criar raid</button>
        </form>
        <div id="lista-raids" class="stack"></div>
      </section>

      <section id="painel-raid" class="card" hidden>
        <h2 class="card__title">Raid: <span id="raid-titulo"></span></h2>
        <p id="raid-resumo" class="card__hint"></p>

        <h3 class="card__subtitle">Inscrever</h3>
        <form id="form-inscricao" class="form">
          <label class="field field--grow">
            <span class="field__label">Jogador</span>
            <select class="field__control" name="jogadorId" id="select-inscricao" required></select>
          </label>
          <button class="btn btn--primary" type="submit">Inscrever</button>
        </form>

        <div class="split">
          <div>
            <h3 class="card__subtitle">Confirmados</h3>
            <div id="lista-confirmados" class="stack"></div>
          </div>
          <div>
            <h3 class="card__subtitle">Fila de espera</h3>
            <div id="lista-fila" class="stack"></div>
          </div>
        </div>

        <h3 class="card__subtitle">Presença</h3>
        <form id="form-presenca" class="form">
          <div id="check-presenca" class="stack"></div>
          <button class="btn btn--primary" type="submit">Registrar presença</button>
        </form>
        <p class="card__hint">Participantes efetivos: <span id="lista-participantes">—</span></p>

        <h3 class="card__subtitle">Loot</h3>
        <form id="form-loot" class="form">
          <label class="field">
            <span class="field__label">Id</span>
            <input class="field__control" name="id" required />
          </label>
          <label class="field field--grow">
            <span class="field__label">Nome</span>
            <input class="field__control" name="nome" required />
          </label>
          <label class="field">
            <span class="field__label">Categoria</span>
            <select class="field__control" name="categoria">
              <option value="arma">arma</option>
              <option value="armadura">armadura</option>
              <option value="acessorio">acessorio</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Função</span>
            <select class="field__control" name="funcaoRequerida">
              <option value="tank">tank</option>
              <option value="healer">healer</option>
              <option value="dps">dps</option>
            </select>
          </label>
          <button class="btn btn--primary" type="submit">Registrar item</button>
        </form>
        <div id="lista-loots" class="stack"></div>
      </section>

      <section class="card">
        <h2 class="card__title">Histórico</h2>
        <form id="form-historico" class="form">
          <label class="field field--grow">
            <span class="field__label">Id do jogador</span>
            <input class="field__control" name="jogadorId" required />
          </label>
          <button class="btn btn--primary" type="submit">Consultar</button>
        </form>
        <pre id="historico" class="history"></pre>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
